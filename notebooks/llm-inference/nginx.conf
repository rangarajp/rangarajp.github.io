pid logs/nginx.pid;
error_log logs/nginx-error.log;

events {
}

http {
    access_log logs/nginx-access.log;
    client_body_temp_path logs/nginx-client-body;
    proxy_temp_path logs/nginx-proxy;
    fastcgi_temp_path logs/nginx-fastcgi;
    uwsgi_temp_path logs/nginx-uwsgi;
    scgi_temp_path logs/nginx-scgi;
    limit_req_zone $binary_remote_addr zone=generate_limit:10m rate=5r/s;

    upstream llm_gateway {
        server 127.0.0.1:8000;
    }

    server {
        listen 127.0.0.1:8080;
        server_name localhost;

        client_max_body_size 64k;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        location = /api/v1/health {
            proxy_pass http://llm_gateway/health;
        }

        location = /api/v1/status {
            proxy_pass http://llm_gateway/status;
        }

        location = /api/v1/models {
            proxy_pass http://llm_gateway/models;
        }

        location = /api/v1/metrics {
            proxy_pass http://llm_gateway/metrics;
        }

        location = /api/v1/generate {
            limit_req zone=generate_limit burst=10 nodelay;
            proxy_pass http://llm_gateway/generate;
        }

        location = /ui {
            proxy_pass http://llm_gateway/ui;
        }

        location = /health {
            proxy_pass http://llm_gateway/health;
        }

        location = /status {
            proxy_pass http://llm_gateway/status;
        }

        location = /models {
            proxy_pass http://llm_gateway/models;
        }

        location = /metrics {
            proxy_pass http://llm_gateway/metrics;
        }
    }
}
